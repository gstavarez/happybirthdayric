<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="mesa-cartas">

    <!-- CARTA 1 -->
    <div class="carta" onclick="this.classList.toggle('virada')">
      <div class="carta-interna">
        <div class="carta-face carta-verso">
          <svg viewBox="0 0 434 646" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip-verso-1)">
              <rect width="434" height="646" rx="20" fill="#3269B2"/>
              <image href="verso.png" x="0" y="0" width="434" height="646" preserveAspectRatio="xMidYMid slice"/>
            </g>
            <rect x="2" y="2" width="430" height="642" rx="18" stroke="url(#grad-verso-1)" stroke-width="4"/>
            <defs>
              <linearGradient id="grad-verso-1" x1="0" y1="0" x2="434" y2="646" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
                <stop offset="0.5" stop-color="#7AB8FF" stop-opacity="0.5"/>
                <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
              </linearGradient>
              <clipPath id="clip-verso-1">
                <rect width="434" height="646" rx="20" fill="white"/>
              </clipPath>
            </defs>
          </svg>
        </div>

        <div class="carta-face carta-frente">
          <svg viewBox="0 0 434 646" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip-frente-1)">
              <rect width="434" height="646" rx="20" fill="#3269B2"/>
              <image href="imagem-carta1.png" x="0" y="0" width="434" height="646" preserveAspectRatio="xMidYMid slice"/>
            </g>
            <rect x="2" y="2" width="430" height="642" rx="18" stroke="url(#grad-frente-1)" stroke-width="4"/>
            <defs>
              <linearGradient id="grad-frente-1" x1="0" y1="0" x2="434" y2="646" gradientUnits="userSpaceOnUse">
                <stop stop-color="#FFFFFF" stop-opacity="0.85"/>
                <stop offset="0.5" stop-color="#7AB8FF" stop-opacity="0.5"/>
                <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
              </linearGradient>
              <clipPath id="clip-frente-1">
                <rect width="434" height="646" rx="20" fill="white"/>
              </clipPath>
            </defs>
          </svg>
        </div>
      </div>
    </div>
