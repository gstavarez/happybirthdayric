<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para Ric</title>
  <link rel="stylesheet" href="style.css" />
</head>
<!-- Troque "theme-light" por "theme-dark" se preferir fundo escuro -->
<body class="theme-light">

  <main class="stage">
    <header class="status-bar">
      <p class="hint-text" id="hintText">Clique nas cartas para revelar</p>
      <span class="counter" id="counter">0 / 5</span>
    </header>

    <section class="deck-area" aria-label="Baralho interativo">

      <!-- ================================================================
           CARTA 01
           ================================================================ -->
      <article class="card-slot" style="--index: 0; --fan-x: -220px; --fan-y: 26px; --fan-rot: -16deg;" tabindex="0" role="button" aria-pressed="false" aria-label="Carta 1">
        <div class="card-inner">
          <div class="card-face card-back card-back--01">
            <div class="card-art">
              <img src="verso.svg" alt="Verso da carta 1" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>

          <div class="card-face card-front card-front--01">
            <div class="card-art">
              <img src="carta1.svg" alt="Carta 1" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>
        </div>
      </article>

      <!-- ================================================================
           CARTA 02
           ================================================================ -->
      <article class="card-slot" style="--index: 1; --fan-x: -110px; --fan-y: 8px; --fan-rot: -8deg;" tabindex="0" role="button" aria-pressed="false" aria-label="Carta 2">
        <div class="card-inner">
          <div class="card-face card-back card-back--02">
            <div class="card-art">
              <img src="verso.svg" alt="Verso da carta 2" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>

          <div class="card-face card-front card-front--02">
            <div class="card-art">
              <img src="carta2.svg" alt="Carta 2" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>
        </div>
      </article>

      <!-- ================================================================
           CARTA 03 (CENTRAL)
           ================================================================ -->
      <article class="card-slot" style="--index: 2; --fan-x: 0px; --fan-y: 0px; --fan-rot: 0deg;" tabindex="0" role="button" aria-pressed="false" aria-label="Carta 3">
        <div class="card-inner">
          <div class="card-face card-back card-back--03">
            <div class="card-art">
              <img src="verso.svg" alt="Verso da carta 3" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>

          <div class="card-face card-front card-front--03">
            <div class="card-art">
              <img src="carta3.svg" alt="Carta 3" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>
        </div>
      </article>

      <!-- ================================================================
           CARTA 04
           ================================================================ -->
      <article class="card-slot" style="--index: 3; --fan-x: 110px; --fan-y: 8px; --fan-rot: 8deg;" tabindex="0" role="button" aria-pressed="false" aria-label="Carta 4">
        <div class="card-inner">
          <div class="card-face card-back card-back--04">
            <div class="card-art">
              <img src="verso.svg" alt="Verso da carta 4" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>

          <div class="card-face card-front card-front--04">
            <div class="card-art">
              <img src="carta4.svg" alt="Carta 4" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>
        </div>
      </article>

      <!-- ================================================================
           CARTA 05
           ================================================================ -->
      <article class="card-slot" style="--index: 4; --fan-x: 220px; --fan-y: 26px; --fan-rot: 16deg;" tabindex="0" role="button" aria-pressed="false" aria-label="Carta 5">
        <div class="card-inner">
          <div class="card-face card-back card-back--05">
            <div class="card-art">
              <img src="verso.svg" alt="Verso da carta 5" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>

          <div class="card-face card-front card-front--05">
            <div class="card-art">
              <img src="carta5.svg" alt="Carta 5" class="card-svg" />
            </div>
            <div class="card-glare"></div>
          </div>
        </div>
      </article>

    </section>

    <footer class="final-message" id="finalMessage" aria-hidden="true">
      <h1>Feliz aniversário, Ric!</h1>
      <button type="button" class="reset-btn" id="resetBtn">Virar cartas novamente</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
